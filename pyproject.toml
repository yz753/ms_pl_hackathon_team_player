[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-player-prototype"
version = "0.5.0"
description = "Synthetic football tracking, causal streaming geometry and paired experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
team-player = "team_player.cli:main"

[tool.setuptools.packages.find]
include = ["team_player*"]
